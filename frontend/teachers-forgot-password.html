<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Forgot Password | Lagos State Model College Meiran
    </title>

    <link
        rel="icon"
        type="image/jpg"
        href="images/school.jpg"
    >
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- PAGE LOADER -->

    <div id="pageLoader">

        <div class="loader-content">

            <img
                src="images/school.jpg"
                alt="School Logo"
                class="loader-logo"
            >

            <h2>
                Lagos State Model College Meiran
            </h2>

            <p>
                Loading...
            </p>

            <div class="loader-spinner"></div>

        </div>

    </div>


    <!-- FORGOT PASSWORD -->

    <div class="auth-container">

        <div class="auth-card">

            <!-- SCHOOL LOGO -->

            <div class="auth-logo">

                <img
                    src="images/school.jpg"
                    alt="School Logo"
                >

            </div>


            <!-- TITLE -->

            <h1>
                Forgot Password?
            </h1>

            <p class="auth-subtitle">
                Teacher Password Recovery
            </p>


            <!-- MESSAGE -->

            <div
                id="forgotPasswordMessage"
                class="auth-message"
                style="display:none;"
            ></div>


            <!-- FORM -->

            <form id="forgotPasswordForm">

                <!-- USERNAME -->

                <div class="form-group">

                    <label for="forgotUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="forgotUsername"
                        name="username"
                        placeholder="Enter your teacher username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="forgotPhone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="forgotPhone"
                        name="phone"
                        placeholder="Enter your registered phone number"
                        autocomplete="tel"
                        required
                    >

                </div>


                <!-- NEW PASSWORD -->

                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        placeholder="Enter your new password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your new password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="auth-button"
                    id="resetPasswordButton"
                >

                    Reset Password

                </button>

            </form>


            <!-- BACK TO LOGIN -->

            <div class="auth-links">

                <a href="admin-login.html">
                    ← Back to Staff Login
                </a>

            </div>

        </div>

    </div>


    <script src="forgot-password.js"></script>

    <script src="loading.js"></script>

</body>

</html>
