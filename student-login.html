<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | Lagos State Model College Meiran</title>

    <link rel="icon" type="image/jpg" href="images/school.jpg">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <section class="login-page">

        <div class="login-box">

            <img src="images/school.jpg"
                 alt="School Logo"
                 class="login-logo">

            <p class="section-label">STUDENT PORTAL</p>

            <h1>Student Login</h1>

            <p class="login-description">
                Enter your student information to access the portal.
            </p>

            <form id="studentLoginForm">

                <label for="admission-number">
                    Admission Number
                </label>

                <input
                    type="text"
                    id="admission-number"
                    placeholder="Enter admission number"
                    required
                >

                <label for="student-name">
                    Student Name
                </label>

                <input
                    type="text"
                    id="student-name"
                    placeholder="Enter your name"
                    required
                >

                <button type="submit" class="btn">
                    Login
                </button>

            </form>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </section>
    <script src="script.js"></script>

</body>

</html>
